# ------------------------------------------------------------------
# Project 117 — Phase 1 compose stack
# Phase 1 runs the backend locally. Ollama is optional (profile "ollama").
# OpenSandbox joins the stack in Phase 9 (sandbox integration).
# ------------------------------------------------------------------
name: project117

services:
  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    command: uvicorn backend.api.src.main:create_app --factory --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    environment:
      P117_API_HOST: 0.0.0.0
      P117_API_PORT: 8000
      P117_DATABASE_URL: sqlite:////data/project117.db
      P117_UPLOADS_DIR: /data/uploads
      P117_LLM_BASE_URL: http://ollama:11434/v1
    ports:
      - "8000:8000"
    volumes:
      - project117-data:/data
    depends_on:
      ollama:
        condition: service_healthy
        required: false
    restart: unless-stopped

  # Local model serving for the core inference path. Optional in Phase 1
  # (the backend health check degrades gracefully without it).
  ollama:
    # Pinned to stable release tag. In sovereign air-gapped environments, pin
    # by sha256 digest once resolved against registry (e.g. ollama/ollama:0.5.11@sha256:...).
    image: ollama/ollama:0.5.11
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenSandbox server (isolated code execution control plane).
  # Enforces default-deny egress and per-container resource bounds.
  opensandbox:
    image: opensandbox/server:0.1.0
    profiles: ["sandbox"]
    ports:
      - "8080:8080"
    environment:
      OPEN_SANDBOX_DEFAULT_NETWORK_POLICY: deny
      OPEN_SANDBOX_API_KEY: ${P117_SANDBOX_API_KEY:-dev-sandbox-key}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  project117-data:
  ollama-models: