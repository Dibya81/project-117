[project]
name = "project117-backend"
version = "0.1.0"
description = "Project 117 backend — sovereign, local, agentic industrial AI for manufacturing operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "lancedb>=0.38.0",
    "docling>=2.126.0",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
    # Imported but previously undeclared — they happened to arrive as
    # transitive dependencies, which made `uv sync` reproducible only by luck:
    #   python-dotenv : .env loading behind pydantic-settings
    #   numpy         : embedder outputs
    #   pyarrow       : LanceDB returns Arrow tables
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
]

# Opt-in only: `uv sync --extra rerank`.
# Every reranker backend we vendor resolves to a Hugging Face download, so an
# air-gapped install must be able to skip this entire stack (torch alone is
# ~2 GB). See docs/decisions/0003-phase-0.5-hardening.md.
[project.optional-dependencies]
# Graph RAG. LightRAG is published on PyPI; the previous path source
# (../LightRAG-main) made a clean checkout unresolvable because that sibling
# directory is not part of this repository. It is now a normal, versioned,
# opt-in extra: `uv sync --extra graphrag`. To develop against a local clone
# instead, see [tool.uv.sources] below and docs/SETUP.md.
graphrag = [
    "lightrag-hku>=1.3",
]
# Vendored localGPT retrieval stack (LanceDB + Docling + PyMuPDF are already
# core dependencies; this extra only pulls what the vendored pipeline adds).
# localGPT itself is vendored source, not a PyPI package - see docs/SETUP.md.
localgpt = [
    "sentence-transformers>=3.0",
]
rerank = [
    "torch>=2.4",
    "transformers>=4.51",
    "sentencepiece>=0.2",
    "accelerate>=1.0",
    "rerankers>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "pyright>=1.1.370",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "integration: opt-in tests requiring the vendor stack and local Ollama",
]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["backend"]
# Vendored localGPT is imported at runtime via sys.path. The path below is
# in-repository and optional: if vendor/localGPT is absent, pyright simply
# reports rag_system.* as unresolved and the runtime falls back to the
# lexical retrieval backend (see backend/simulation/retrieval.py).
# Populate it with: make vendor-localgpt   (documented in docs/SETUP.md)
extraPaths = ["vendor/localGPT"]
venvPath = "."
venv = ".venv"

# No path sources by default: a clean checkout must resolve from PyPI alone.
# To develop against a local LightRAG clone, place it at vendor/LightRAG and
# uncomment the block below (documented in docs/SETUP.md).
# [tool.uv.sources]
# lightrag-hku = { path = "vendor/LightRAG", editable = true }
